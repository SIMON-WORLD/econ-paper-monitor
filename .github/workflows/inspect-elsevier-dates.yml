name: Inspect Elsevier Date Fields

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum Elsevier DOI candidates to inspect"
        required: false
        default: "50"

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect Elsevier Article API date fields
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: python scripts/inspect_elsevier_dates.py --data-dir data --limit "${{ inputs.limit }}" --output data/elsevier_date_inspection.json
      - name: Upload date-field inspection report
        uses: actions/upload-artifact@v4
        with:
          name: elsevier-date-inspection
          path: data/elsevier_date_inspection.json
