name: Render Paper Monitor Site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build_daily_vnext.py"
      - "scripts/display_contract.py"
      - "scripts/render_site.py"
      - "scripts/build_feed.py"
      - "docs/daily-vnext/template.html"
      - ".github/workflows/render-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-monitor-main-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical input
        shell: bash
        run: |
          DAILY_DATE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d"))
          PY
          )
          python - "$DAILY_DATE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data/daily") / f"{sys.argv[1]}.json"
          if not path.exists():
              raise SystemExit(f"canonical daily file is missing: {path}")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, list) or any(not isinstance(item, dict) for item in payload):
              raise SystemExit(f"canonical daily file is not a list of records: {path}")
          print(f"Canonical input validated: {path} ({len(payload)} records)")
          PY
      - name: Resolve Beijing date
        id: date
        shell: bash
        run: |
          echo "value=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d"))
          PY
          )" >> "$GITHUB_OUTPUT"
      - name: Render secondary pages
        run: python scripts/render_site.py
      - name: Render root and Daily vNext from the same canonical input
        run: |
          python scripts/build_daily_vnext.py --date "${{ steps.date.outputs.value }}" --output docs/index.html --report "$RUNNER_TEMP/daily-home-report.json"
          python scripts/build_daily_vnext.py --date "${{ steps.date.outputs.value }}" --output docs/daily-vnext/index.html --report "$RUNNER_TEMP/daily-vnext-report.json"
      - name: Build feed
        run: python scripts/build_feed.py --site-url https://academic-door.github.io/econ-paper-monitor/
      - name: Verify generated output boundary
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/daily-vnext/index.html
          test -f docs/feed.xml
          test -f docs/classic/index.html
          python - <<'PY'
          from pathlib import Path
          root = Path("docs/index.html").read_text(encoding="utf-8")
          vnext = Path("docs/daily-vnext/index.html").read_text(encoding="utf-8")
          classic = Path("docs/classic/index.html").read_text(encoding="utf-8")
          assert "今日研究时间流" in root and "今日研究时间流" in vnext
          assert "class=\"sidebar\"" not in root and "class=\"sidebar\"" not in vnext
          assert "class=\"sidebar\"" in classic
          print("Homepage, Daily vNext, and Classic output contract passed")
          PY
      - name: Commit generated site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
            exit 0
          fi
          git commit -m "Render paper monitor site"
          git push origin HEAD:main
