name: Test Paper Monitor

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build and validate Daily Door vNext
        shell: bash
        run: |
          DAILY_DATE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d"))
          PY
          )
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output "$RUNNER_TEMP/daily-vnext.html" --report "$RUNNER_TEMP/daily-vnext-report.json"
          python - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext.html"
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-report.json").read_text())
          parser = HTMLParser()
          parser.feed(output.read_text(encoding="utf-8"))
          html = output.read_text(encoding="utf-8")
          rendered = html.count('class="paper-entry"')
          assert rendered == report["final_render_count"], (rendered, report["final_render_count"])
          assert "data-count=\"" in html
          print(f"Daily vNext validated: {rendered} entries")
          PY
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.env.RUNNER_TEMP + '/daily-vnext.html', 'utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map(match => match[1]).filter(Boolean);
          scripts.forEach(script => new Function(script));
          console.log(`Daily vNext JavaScript validated: ${scripts.length} inline scripts`);
          NODE
      - name: Verify empty Daily protection
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          probe = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-preserved.html"
          probe.write_text("previous-valid-page", encoding="utf-8")
          env = os.environ.copy()
          env.pop("ALLOW_EMPTY_DAILY", None)
          result = subprocess.run(
              [sys.executable, "scripts/build_daily_vnext.py", "--date", "2099-01-01", "--output", str(probe)],
              env=env,
              capture_output=True,
              text=True,
          )
          assert result.returncode != 0, result.stdout + result.stderr
          assert probe.read_text(encoding="utf-8") == "previous-valid-page"
          print("Empty Daily protection validated: previous HTML preserved")
          PY
