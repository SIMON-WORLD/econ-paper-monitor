name: tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run test suite
        run: python -m pytest -q
